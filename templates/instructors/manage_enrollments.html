{% extends 'base.html' %}
{% block title %}Manage Enrollments | LAP{% endblock %}

{% block content %}
<div class="container py-4 d-flex justify-content-center">
  <div class="overlay-box w-100" style="max-width: 1100px;">
    <div class="p-4">

      <h3 class="fw-bold mb-4 text-center section-heading">
        Student Enrollments
      </h3>

      <!-- 🔎 AJAX Search + Filters -->
      <form id="enrollment-filter-form" method="GET" class="mb-4">
        <div class="row g-3 align-items-end">

          <div class="col-md-4">
            <input type="text"
                   name="search"
                   value="{{ request.GET.search }}"
                   class="form-control"
                   placeholder="Search by name or email">
          </div>

          <div class="col-md-3">
            <select name="course" class="form-select">
              <option value="">All Courses</option>
              {% for course in instructor_courses %}
              <option value="{{ course.id }}"
                {% if selected_course == course.id|stringformat:'s' %}selected{% endif %}>
                {{ course.title }}
              </option>
              {% endfor %}
            </select>
          </div>

          <div class="col-md-3">
            <select name="sort" class="form-select">
              <option value="newest">Newest</option>
              <option value="oldest">Oldest</option>
              <option value="name">Name</option>
              <option value="email">Email</option>
              <option value="course">Course</option>
            </select>
          </div>

          <div class="col-md-2 d-grid">
            <button class="btn btn-info fw-semibold">Apply</button>
          </div>

        </div>
      </form>

      <!-- 📦 AJAX TABLE CONTAINER -->
      <div id="enrollment-container">
        {% include "instructors/enrollment_table.html" %}
      </div>

    </div>
  </div>
</div>

<style>
.table-gradient {
  background: linear-gradient(135deg, #1a4a8c 0%, #2a7df5 100%);
}
.overlay-box {
  background: var(--bs-body-bg);
  border-radius: 1rem;
  box-shadow: 0 0.5rem 1.5rem rgba(0,0,0,0.1);
}
.table tbody tr:hover {
  background-color: rgba(0,0,0,0.05);
  transition: 0.2s;
}
.fade-wrapper {
  transition: opacity 0.25s ease;
}
</style>

<!-- 🚀 AJAX SCRIPT -->
<script>
document.addEventListener("DOMContentLoaded", function () {

  const form = document.getElementById("enrollment-filter-form");
  const container = document.getElementById("enrollment-container");

  let timeout = null;

  function fetchData() {
    const params = new URLSearchParams(new FormData(form));

    container.style.opacity = "0.4";

    fetch("?" + params.toString(), {
      headers: { "X-Requested-With": "XMLHttpRequest" }
    })
    .then(res => res.text())
    .then(html => {
      container.innerHTML = html;
      container.style.opacity = "1";
    });
  }

  form.addEventListener("input", function () {
    clearTimeout(timeout);
    timeout = setTimeout(fetchData, 300);
  });

  form.addEventListener("submit", function(e) {
    e.preventDefault();
    fetchData();
  });

  container.addEventListener("click", function(e) {
    if (e.target.classList.contains("ajax-action")) {
      const url = e.target.dataset.url;

      fetch(url, {
        headers: { "X-Requested-With": "XMLHttpRequest" }
      }).then(() => fetchData());
    }
  });

});
</script>

{% endblock %}
