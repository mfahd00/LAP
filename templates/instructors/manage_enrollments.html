{% extends 'base.html' %}
{% block title %}Manage Enrollments | LAP{% endblock %}

{% block content %}
<div class="container py-3">

  <!-- HEADER + ACTIONS -->
  <div class="page-title-row d-flex justify-content-between align-items-center mb-2">

    <div>
      <h3 class="section-heading mb-1">Student Enrollments</h3>
      <p class="section-subheading mb-0">
        Review and manage pending and approved course enrollments.
      </p>
    </div>

    <div class="d-flex gap-2">
      <button form="enrollment-filter-form" class="btn btn-primary px-4">
        Apply
      </button>

      <a href="{% url 'manage_enrollments' %}" class="btn btn-secondary px-4">
        Reset
      </a>
    </div>

  </div>

  <!-- COMPACT FILTER PANEL -->
  <div class="content-panel mb-3 py-3 px-3">
    <form id="enrollment-filter-form" method="get" class="row g-2">

      <!-- SEARCH -->
      <div class="col-md-3">
        <input 
          type="text" 
          name="search" 
          value="{{ request.GET.search }}" 
          class="form-control"
          placeholder="Search name or email"
        >
      </div>

      <!-- COURSE -->
      <div class="col-md-2">
        <select name="course" class="form-select">
          <option value="">All Courses</option>
          {% for course in instructor_courses %}
            <option value="{{ course.id }}"
              {% if selected_course == course.id|stringformat:'s' %}selected{% endif %}>
              {{ course.title }}
            </option>
          {% endfor %}
        </select>
      </div>

      <!-- DEPARTMENT -->
      <div class="col-md-2">
        <select name="department" class="form-select">
          <option value="">All Departments</option>
          {% for dept in departments %}
            <option value="{{ dept.id }}"
              {% if request.GET.department == dept.id|stringformat:'s' %}selected{% endif %}>
              {{ dept.name }}
            </option>
          {% endfor %}
        </select>
      </div>

      <!-- YEAR -->
      <div class="col-md-2">
        <select name="year" class="form-select">
          <option value="">All Years</option>
          <option value="1" {% if request.GET.year == "1" %}selected{% endif %}>Year 1</option>
          <option value="2" {% if request.GET.year == "2" %}selected{% endif %}>Year 2</option>
          <option value="3" {% if request.GET.year == "3" %}selected{% endif %}>Year 3</option>
          <option value="4" {% if request.GET.year == "4" %}selected{% endif %}>Year 4</option>
        </select>
      </div>

      <!-- SORT -->
      <div class="col-md-3">
        <select name="sort" class="form-select">
          <option value="newest" {% if request.GET.sort == "newest" %}selected{% endif %}>Newest</option>
          <option value="oldest" {% if request.GET.sort == "oldest" %}selected{% endif %}>Oldest</option>
          <option value="name" {% if request.GET.sort == "name" %}selected{% endif %}>Name</option>
          <option value="email" {% if request.GET.sort == "email" %}selected{% endif %}>Email</option>
          <option value="course" {% if request.GET.sort == "course" %}selected{% endif %}>Course</option>
        </select>
      </div>

    </form>
  </div>

  <!-- TABLE -->
  <div class="content-panel">
    <div class="table-shell">
      <div id="enrollment-container" class="fade-wrapper">
        {% include "instructors/enrollment_table.html" %}
      </div>
    </div>
  </div>

</div>
{% endblock %}
