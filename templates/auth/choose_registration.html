{% extends 'base.html' %}
{% block title %}Choose Registration | LAP{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="auth-card auth-card-sm text-center">
    <h2 class="section-heading mb-2">Choose Registration Type</h2>
    <p class="auth-subtitle mb-4">Select the account type you want to create.</p>

    <div class="d-grid gap-2">
      <a href="{% url 'register_student' %}" class="btn">Register as Student</a>
      <a href="{% url 'register_instructor' %}" class="btn btn-primary">Register as Instructor</a>
    </div>

    <p class="mt-3 mb-0">Already have an account? <a href="{% url 'login' %}">Login</a></p>
  </div>
</div>
{% endblock %}
