{% extends 'base.html' %}
{% block title %}Reset Password | LAP{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="auth-card auth-card-sm">
    <div class="text-center mb-4">
      <h2 class="section-heading">Reset Password</h2>
      <p class="auth-subtitle">Enter your registered email to receive a reset link.</p>
    </div>

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Email</label>
        {{ form.email }}
      </div>
      <button type="submit" class="btn w-100">Send Reset Link</button>
    </form>
  </div>
</div>
{% endblock %}
