{% extends 'base.html' %}
{% block title %}Reset Password | LAP{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height:85vh;">
  <div class="form-container shadow-lg p-4" style="max-width:460px;width:100%;border-radius:15px;">
    <h2 class="fw-bold text-center mb-4">Reset Your Password</h2>

    <form method="POST">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-medium">Enter your registered email</label>
        {{ form.email }}
      </div>

      <button type="submit" class="btn w-100 py-2">
        Send Reset Link
      </button>
    </form>
  </div>
</div>
{% endblock %}
