{% extends 'base.html' %}
{% block title %}Set New Password | LAP{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="auth-card auth-card-sm">
    <div class="text-center mb-4">
      <h2 class="section-heading">Set New Password</h2>
      <p class="auth-subtitle">Choose a strong password for your account.</p>
    </div>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn w-100">Reset Password</button>
    </form>
  </div>
</div>
{% endblock %}
