{% extends 'base.html' %}
{% block title %}Moderator Login | LAP{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="auth-card auth-card-sm">
    <div class="text-center mb-4">
      <h2 class="section-heading">Moderator Login</h2>
      <p class="auth-subtitle">Access platform moderation and governance tools.</p>
    </div>

    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

    <form method="post" action="{% url 'login_moderator' %}">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label" for="username">Username</label>
        <input type="text" name="username" id="username" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input type="password" name="password" id="password" class="form-control" required>
      </div>
      <button type="submit" class="btn w-100">Login</button>
    </form>

    <p class="text-center mt-3 mb-0">Need access? Contact the administrator.</p>
  </div>
</div>
{% endblock %}
