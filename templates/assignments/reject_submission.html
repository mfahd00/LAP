{% extends 'base.html' %}
{% block title %}Reject Submission | LAP{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="auth-shell" style="min-height:auto;">
    <div class="auth-card auth-card-sm">
      <div class="text-center mb-3">
        <h3 class="section-heading">Reject Submission</h3>
        <p class="auth-subtitle mb-0">{{ submission.enrollment.student.username }}</p>
      </div>

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Reason for rejection</label>
          <textarea name="reason" rows="4" class="form-control" required></textarea>
        </div>

        <div class="d-flex gap-2 flex-wrap">
          <a href="{% url 'view_submissions' submission.assignment.id %}" class="btn btn-outline-secondary">Cancel</a>
          <button type="submit" class="btn btn-danger">Reject</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
