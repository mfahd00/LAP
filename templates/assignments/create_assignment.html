{% extends 'base.html' %}
{% block title %}Create Assignment | LAP{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="auth-shell" style="min-height:auto;">
    <div class="auth-card">
      <div class="text-center mb-4">
        <h2 class="section-heading">Create Assignment</h2>
        <p class="auth-subtitle mb-0">{{ course.title }}</p>
      </div>

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label for="id_title" class="form-label">Title</label>
          <input type="text" name="title" id="id_title" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="id_description" class="form-label">Description</label>
          <textarea name="description" id="id_description" rows="4" class="form-control" required></textarea>
        </div>

        <div class="mb-3">
          <label for="id_relative_due_days" class="form-label">Relative Due Days</label>
          <input type="number" name="relative_due_days" id="id_relative_due_days" class="form-control" min="1" max="{{ course.duration_days|add:5 }}" required>
          <div class="form-text text-muted">Maximum {{ course.duration_days|add:5 }} days (course duration + 5).</div>
        </div>

        <button type="submit" class="btn w-100">Create Assignment</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
