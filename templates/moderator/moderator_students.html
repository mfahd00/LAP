{% extends 'base.html' %}
{% block title %}Students | LAP{% endblock %}

{% block content %}
<div class="container py-4">

  <div class="page-title-row mb-3 d-flex justify-content-between align-items-center">

  <!-- LEFT: Title -->
  <div>
    <h3 class="section-heading mb-0">Student Management</h3>
    <p class="section-subheading mb-0">
      Browse student records and enrollment activity.
    </p>
  </div>

  <!-- RIGHT: ACTION BUTTONS -->
  <div class="d-flex gap-2">

    <button id="apply-filters" class="btn">
      Apply
    </button>

    <button id="reset-student-filters" class="btn btn-secondary">
      Reset
    </button>

    <a id="export-btn"
       href="{% url 'export_students_csv' %}?{{ request.GET.urlencode }}"
       class="btn btn-success">
      Export CSV
    </a>

  </div>

</div>

  <!-- FILTER PANEL -->
  <div class="content-panel mb-4">
    <form id="student-filter-form" method="get" class="row g-3 align-items-center">

      <div class="col-md-3">
        <input type="text" name="search"
          value="{{ request.GET.search }}"
          class="form-control search-bar"
          placeholder="Search name/email">
      </div>

      <div class="col-md-2">
        <select name="department" class="form-select control-select">
          <option value="">All Departments</option>
          {% for dept in departments %}
            <option value="{{ dept.id }}"
              {% if request.GET.department == dept.id|stringformat:"s" %}selected{% endif %}>
              {{ dept.name }}
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-2">
        <select name="enrollment" class="form-select control-select">
          <option value="">All</option>
          <option value="active" {% if request.GET.enrollment == "active" %}selected{% endif %}>
            With Enrollments
          </option>
          <option value="none" {% if request.GET.enrollment == "none" %}selected{% endif %}>
            No Enrollments
          </option>
        </select>
      </div>

      <div class="col-md-2">
        <select name="year" class="form-select control-select">
          <option value="">All Years</option>
          <option value="1" {% if request.GET.year == "1" %}selected{% endif %}>Year 1</option>
          <option value="2" {% if request.GET.year == "2" %}selected{% endif %}>Year 2</option>
          <option value="3" {% if request.GET.year == "3" %}selected{% endif %}>Year 3</option>
          <option value="4" {% if request.GET.year == "4" %}selected{% endif %}>Year 4</option>
          <option value="5" {% if request.GET.year == "5" %}selected{% endif %}>Year 5</option>
        </select>
      </div>

      <div class="col-md-3">
        <select name="sort" class="form-select control-select">
          <option value="date_joined" {% if request.GET.sort == "date_joined" %}selected{% endif %}>
            Newest
          </option>
          <option value="name" {% if request.GET.sort == "name" %}selected{% endif %}>
            Name
          </option>
          <option value="enrollments" {% if request.GET.sort == "enrollments" %}selected{% endif %}>
            Most Enrollments
          </option>
        </select>
      </div>

    </form>
  </div>

  <!-- TABLE -->
  <div id="student-container" class="fade-wrapper">
    {% include "moderator/student_table.html" %}
  </div>

</div>
{% endblock %}


{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function () {

  const form = document.getElementById('student-filter-form');
  const container = document.getElementById('student-container');

  const applyBtn = document.getElementById('apply-filters');
  const resetBtn = document.getElementById('reset-student-filters');
  const exportBtn = document.getElementById('export-btn');

  let timeout = null;

  function fetchData() {
    const params = new URLSearchParams(new FormData(form));

    container.style.opacity = '0.4';

    fetch('?' + params.toString(), {
      headers: { 'X-Requested-With': 'XMLHttpRequest' }
    })
    .then(res => res.text())
    .then(html => {
      container.innerHTML = html;
      container.style.opacity = '1';

      /* update export link dynamically */
      exportBtn.href = "{% url 'export_students_csv' %}?" + params.toString();
    });
  }

  /* live typing */
  form.addEventListener('input', function () {
    clearTimeout(timeout);
    timeout = setTimeout(fetchData, 300);
  });

  /* apply */
  applyBtn.addEventListener('click', function () {
    fetchData();
  });

  /* reset */
  resetBtn.addEventListener('click', function () {

    form.reset();

    const selects = form.querySelectorAll('select');
    selects.forEach(select => select.selectedIndex = 0);

    history.replaceState(null, '', window.location.pathname);

    fetchData();
  });

});
</script>
{% endblock %}
